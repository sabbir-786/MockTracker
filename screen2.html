<script>
    const START_Q = parseInt(localStorage.getItem("startQuestion")) || 1;
    const END_Q = parseInt(localStorage.getItem("endQuestion")) || 10;
    const TOTAL_QUESTIONS = (END_Q - START_Q) + 1;
    
    // Timer Setup
    const timeLimitMins = parseInt(localStorage.getItem("timeLimit")) || 0;
    const timerMode = localStorage.getItem("timerMode") || "negative";
    let timeRemaining = parseInt(localStorage.getItem("timeRemaining"));
    let timeSpent = parseInt(localStorage.getItem("timeSpent")) || 0; // Tracks total time taken
    let timerInterval;

    let currentQuestion = START_Q;
    let answers = JSON.parse(localStorage.getItem("bankAnswers")) || {};

    document.getElementById("rangeDisplay").textContent = `Q. ${START_Q} to ${END_Q}`;
    document.getElementById("totalQuestions").textContent = TOTAL_QUESTIONS;
    document.getElementById("progressTotal").textContent = TOTAL_QUESTIONS;

    // Display the timer box only if a limit was set
    if (timeLimitMins > 0) {
        document.getElementById("timerBox").style.display = "flex";
        if (isNaN(timeRemaining)) {
            timeRemaining = timeLimitMins * 60;
        }
    }

    // Start background tracking for ALL modes
    function startTimer() {
        if (timeLimitMins > 0) updateTimerDisplay();
        
        timerInterval = setInterval(() => {
            // Always track elapsed time
            timeSpent++;
            localStorage.setItem("timeSpent", timeSpent);

            // If time limit exists, manage the countdown
            if (timeLimitMins > 0) {
                timeRemaining--;
                localStorage.setItem("timeRemaining", timeRemaining);
                updateTimerDisplay();

                if (timeRemaining <= 0 && timerMode === "autosubmit") {
                    clearInterval(timerInterval);
                    alert("Time is up! Submitting your answers automatically.");
                    finishPractice();
                }
            }
        }, 1000);
    }
    
    // Start it unconditionally
    startTimer();

    function updateTimerDisplay() {
        let isOvertime = timeRemaining < 0;
        let absTime = Math.abs(timeRemaining);
        let m = Math.floor(absTime / 60);
        let s = absTime % 60;
        let timeString = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        
        if (isOvertime) timeString = "-" + timeString;
        document.getElementById("timerDisplay").textContent = timeString;

        const timerBox = document.getElementById("timerBox");
        if (isOvertime) timerBox.classList.add("timer-overtime");
        else timerBox.classList.remove("timer-overtime");
    }

    function createQuestions() {
        const container = document.getElementById("questionsContainer");
        container.innerHTML = "";
        const optionsList = ["A", "B", "C", "D", "E"];

        for (let i = START_Q; i <= END_Q; i++) {
            const data = answers[i] || { userAnswer: null, result: null, correctAnswer: null };

            const card = document.createElement("div");
            card.className = "question-card";
            card.id = `question-${i}`;

            let radiosHTML = optionsList.map(opt => `
                <label class="radio-label ${data.userAnswer === opt ? 'selected' : ''}">
                    <input type="radio" name="q${i}" value="${opt}" 
                           onchange="setUserAnswer(${i}, '${opt}')"
                           ${data.userAnswer === opt ? 'checked' : ''}>
                    ${opt}
                </label>
            `).join('');

            card.innerHTML = `
                <div class="question-number">Q${i}.</div>
                <div class="radio-group">
                    ${radiosHTML}
                </div>
            `;
            container.appendChild(card);
        }
        updateStats();
    }

    function setUserAnswer(question, selectedOption) {
        if (!answers[question]) answers[question] = { userAnswer: null, result: null, correctAnswer: null };
        answers[question].userAnswer = selectedOption;
        saveData();
        createQuestions(); 
        scrollToQuestion(question);
    }

    function saveData() {
        localStorage.setItem("bankAnswers", JSON.stringify(answers));
    }

    function updateStats() {
        let attempted = 0;
        for (let i = START_Q; i <= END_Q; i++) {
            if (answers[i] && answers[i].userAnswer) attempted++;
        }

        const unattempted = TOTAL_QUESTIONS - attempted;
        const percentage = TOTAL_QUESTIONS === 0 ? 0 : Math.round((attempted / TOTAL_QUESTIONS) * 100);

        document.getElementById("attemptedCount").textContent = attempted;
        document.getElementById("unattemptedCount").textContent = unattempted;
        document.getElementById("completedCount").textContent = attempted;
        document.getElementById("completedPercent").textContent = percentage + "%";
        document.getElementById("progressFill").style.width = percentage + "%";
    }

    function nextQuestion() {
        if (currentQuestion < END_Q) {
            currentQuestion++;
            scrollToQuestion(currentQuestion);
        }
    }

    function previousQuestion() {
        if (currentQuestion > START_Q) {
            currentQuestion--;
            scrollToQuestion(currentQuestion);
        }
    }

    function scrollToQuestion(question) {
        const element = document.getElementById(`question-${question}`);
        if (element) {
            const yOffset = -80; 
            const y = element.getBoundingClientRect().top + window.pageYOffset + yOffset;
            window.scrollTo({top: y, behavior: 'smooth'});
        }
    }

    function goBack() {
        window.location.href = "index.html";
    }

    function finishPractice() {
        clearInterval(timerInterval); 
        saveData();
        window.location.href = "screen3.html"; 
    }

    createQuestions();
</script>
